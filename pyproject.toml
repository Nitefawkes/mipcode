[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mipcode"
version = "0.6.0"
description = "Deterministic AST and runtime-traced Python contract checks across call sites and subclasses (mip-delta)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Brian Gansz"}
]
keywords = ["python", "static-analysis", "pre-commit", "code-review", "contract-testing", "ci", "ai-agents", "mipdelta", "mipcode"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
mcp = ["mcp>=1.2.0"]
ast = [
  "tree-sitter>=0.22.0",
  "tree-sitter-rust>=0.23.0",
  "tree-sitter-python>=0.23.0",
  "tree-sitter-typescript>=0.23.0"
]

[project.scripts]
mip-delta = "mipdelta.cli:main_cli"
mip-build = "mipcode.compiler:main_cli"
mip-verify-edit = "mipcode.mcp_server:main_verify_edit_cli"
mip-guardrail = "mipcode.real_repo_deploy:main_cli"
lod-build = "semantic_lod.compiler:main_cli"
lod-verify-edit = "semantic_lod.mcp_server:main_verify_edit_cli"
lod-guardrail = "semantic_lod.real_repo_deploy:main_cli"
